<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prague Stop Collector</title>
<meta name="theme-color" content="#a6d800">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>Prague Stop Collector</h1>
    <div class="header-stats">
      <span id="overallProgress">0 / 0 stops</span>
    </div>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="map">Map</button>
    <button class="tab-btn" data-tab="lines">Lines</button>
    <button class="tab-btn" data-tab="stats">Progress</button>
  </nav>

  <main>
    <section id="tab-map" class="tab-panel active">
      <div id="map"></div>
    </section>

    <section id="tab-lines" class="tab-panel">
      <div class="lines-toolbar">
        <input type="text" id="lineSearch" placeholder="Search lines (e.g. B, 18, 176)…">
        <div class="mode-filters" id="modeFilters"></div>
      </div>
      <div id="linesList" class="lines-list"></div>
    </section>

    <section id="tab-stats" class="tab-panel">
      <div id="statsContent" class="stats-content"></div>
    </section>
  </main>

  <!-- Stop detail bottom sheet -->
  <div id="stopSheetBackdrop" class="sheet-backdrop"></div>
  <div id="stopSheet" class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetStopName">Stop name</h2>
    <p id="sheetLineCount" class="sheet-sub"></p>

    <div class="state-buttons">
      <button id="btnStateNone" class="state-btn" data-state="none">Not collected</button>
      <button id="btnStateTransit" class="state-btn" data-state="transit">🚗 Driven through</button>
      <button id="btnStateVisited" class="state-btn" data-state="visited">⭐ Visited</button>
    </div>
    <p id="sheetTimestamp" class="sheet-timestamp"></p>

    <p class="sheet-hint">Marking this stop updates every line that passes through it.</p>

    <div id="sheetLines" class="sheet-lines"></div>

    <button id="sheetClose" class="sheet-close">Close</button>
  </div>

  <!-- Line detail bottom sheet -->
  <div id="lineSheetBackdrop" class="sheet-backdrop"></div>
  <div id="lineSheet" class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="lineSheetTitle">Line</h2>
    <div class="progress-bar-track"><div id="lineSheetBar" class="progress-bar-fill"></div></div>
    <p id="lineSheetSummary" class="sheet-sub"></p>
    <div id="lineSheetStops" class="line-stop-list"></div>
    <button id="lineSheetClose" class="sheet-close">Close</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
